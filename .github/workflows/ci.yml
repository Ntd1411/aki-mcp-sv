name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Syntax check all scripts (server never actually boots — no PUBLIC_ORIGIN / Tailscale in CI)
        run: find scripts test -name '*.js' -print0 | xargs -0 -n1 node --check
